name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 */3 * *'   # har 3 din mein ek dafa chalega
  workflow_dispatch:         # manually bhi chala sakte ho GitHub se

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent auto-pause
        run: |
          curl -s -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
