function onDMCClassChange() {
  // If results are already loaded and their rows have no per-row class of their own
  // (i.e. the Excel file didn't specify one), keep them in sync with the dropdown.
  const cls = document.getElementById('dmc-class').value;
  dmcResults.forEach(r => { if (!r.classFromExcel) r.class = cls; });
}

let dmcSubjects = []; // {name: 'Urdu', total: 100}
let dmcConfigLoaded = false;

async function loadDMCConfig() {
  if (dmcConfigLoaded) return;
  dmcConfigLoaded = true;
  const { data } = await sb.from('dmc_config').select('*').eq('owner_id', CURRENT_USER.id).maybeSingle();
  if (!data) return;
  if (data.subjects) dmcSubjects = data.subjects;
  if (data.school_name) dmcSchoolName = data.school_name;
  if (data.logo) dmcLogo = data.logo;
  if (data.tagline) dmcTagline = data.tagline;
  if (data.academic_session) dmcAcademicSession = data.academic_session;
  if (data.quote) dmcQuote = data.quote;
}

async function saveDMCConfig() {
  const { error } = await sb.from('dmc_config').upsert({
    owner_id: CURRENT_USER.id, subjects: dmcSubjects, school_name: dmcSchoolName, logo: dmcLogo,
    tagline: dmcTagline, academic_session: dmcAcademicSession, quote: dmcQuote,
    updated_at: new Date().toISOString()
  });
  if (error) console.error('DMC config save failed:', error.message);
}

function addDMCSubject() {
  const name = document.getElementById('dmc-subj-name').value.trim();
  const total = Number(document.getElementById('dmc-subj-total').value) || 100;
  if (!name) return;
  dmcSubjects.push({name, total});
  document.getElementById('dmc-subj-name').value = '';
  saveDMCConfig();
  renderDMCSubjects();
}

function renderDMCSubjects() {
  document.getElementById('dmc-subjects-list').innerHTML = dmcSubjects.map((s, i) => `
    <div style="background:#F0EBDA;padding:6px 10px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:6px;">
      ${esc(s.name)} (${s.total})
      <button class="btn-ghost" style="padding:0;font-size:10px;opacity:.6;" onclick="dmcSubjects.splice(${i},1);saveDMCConfig();renderDMCSubjects();">✕</button>
    </div>
  `).join('');
}

function clearDMCSubjects() {
  dmcSubjects = [];
  saveDMCConfig();
  renderDMCSubjects();
}

function handleDMCExcelUpload(file) {
  if (!file) return;
  const selectedClass = document.getElementById('dmc-class').value;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type: 'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws);

      dmcResults = rows.map((r, idx) => {
        const excelClass = r['Class'] || r['جماعت'] || '';
        return {
          serialNo: idx + 1,
          studentName: r['Student Name'] || r['Name'] || r['Student'] || '',
          fatherName: r['Father Name'] || r["Father's Name"] || r['Father'] || r['S/O'] || r['Walid'] || '',
          class: excelClass || selectedClass || '',
          classFromExcel: !!excelClass, // if true, onDMCClassChange() won't overwrite this row later
          marks: {} // will be filled from other columns
        };
      });
      
      // Extract marks from other columns
      dmcResults.forEach((r, idx) => {
        const row = rows[idx];
        Object.keys(row).forEach(col => {
          if (!['Student Name','Name','Student','Class','جماعت','Father Name',"Father's Name",'Father','S/O','Walid'].includes(col)) {
            r.marks[col] = Number(row[col]) || 0;
          }
        });
      });

      const missingClass = !selectedClass && dmcResults.some(r => !r.class);
      document.getElementById('dmc-upload-msg').innerHTML = missingClass
        ? `⚠️ Loaded ${dmcResults.length} students, but no class is set — select a class above (or add a "Class" column to your Excel) before printing.`
        : `✓ Loaded ${dmcResults.length} students`;
    } catch (err) {
      document.getElementById('dmc-upload-msg').innerHTML = `✗ Error: ${err.message}`;
    }
  };
  reader.readAsArrayBuffer(file);
}

function generateDMCPreview() {
  if (dmcResults.length === 0) { alert('Please upload Excel file first'); return; }
  if (dmcSubjects.length === 0) { alert('Please configure subjects first'); return; }
  
  let html = '<div style="max-height:600px;overflow-y:auto;">';
  dmcResults.slice(0, 3).forEach(r => {
    html += renderDMCCertificate(r);
  });
  html += `</div><p style="font-size:12px;opacity:.5;margin-top:10px;">Showing first 3 of ${dmcResults.length} certificates</p>`;
  document.getElementById('dmc-preview').innerHTML = html;
}

function dmcSubjectIcon(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('eng')) return '🔤';
  if (n.includes('sci')) return '🧪';
  if (n.includes('math') || n.includes('riyazi')) return '🧮';
  if (n.includes('urdu')) return '📖';
  if (n.includes('islam') || n.includes('quran') || n.includes('deen')) return '🕌';
  if (n.includes('gk') || n.includes('general') || n.includes('social') || n.includes('geo')) return '🌍';
  if (n.includes('comp')) return '💻';
  if (n.includes('art') || n.includes('draw')) return '🎨';
  if (n.includes('phys') || n.includes('sport') || n.includes('pt ')) return '⚽';
  return '📘';
}

function renderDMCCertificate(result) {
  const totalObtained = dmcSubjects.reduce((a, s) => a + (Number(result.marks[s.name]) || 0), 0);
  const totalPossible = dmcSubjects.reduce((a,b) => a+b.total, 0);
  const percentage = totalPossible ? ((totalObtained / totalPossible) * 100).toFixed(1) : 0;
  const grade = percentage >= 90 ? 'A+' : percentage >= 80 ? 'A' : percentage >= 70 ? 'B' : percentage >= 60 ? 'C' : percentage >= 40 ? 'D' : 'F';
  const remark = { 'A+':'Outstanding', 'A':'Excellent', 'B':'Very Good', 'C':'Good', 'D':'Satisfactory', 'F':'Fail' }[grade];

  // Position in class
  const classResults = dmcResults.filter(r => r.class === result.class);
  const classTotals = classResults.map(r => dmcSubjects.reduce((a, s) => a + (Number(r.marks[s.name]) || 0), 0));
  const sortedTotals = [...classTotals].sort((a, b) => b - a);
  const position = sortedTotals.indexOf(totalObtained) + 1;
  const totalStudentsInClass = classResults.length;

  const subjectsHtml = dmcSubjects.map(s => {
    const marks = result.marks[s.name] || 0;
    return `
      <tr style="border-bottom:1px solid #E7E0CE;">
        <td style="padding:11px 14px;text-align:left;">
          <span style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#0F2740;font-size:13px;margin-right:10px;vertical-align:middle;">${dmcSubjectIcon(s.name)}</span>
          <span style="font-size:14px;color:#1C2530;vertical-align:middle;">${esc(s.name)}</span>
        </td>
        <td style="padding:11px;text-align:center;font-weight:700;font-size:15px;color:#0F2740;">${marks}</td>
        <td style="padding:11px;text-align:center;font-size:14px;color:#555;">${s.total}</td>
      </tr>`;
  }).join('');

  const statBlock = (icon, label, value) => `
    <div style="text-align:center;">
      <div style="font-size:18px;margin-bottom:4px;">${icon}</div>
      <div style="font-size:10px;color:#0F2740;font-weight:600;letter-spacing:.04em;text-transform:uppercase;">${label}</div>
      <div style="font-size:15px;font-weight:700;color:#0F2740;margin-top:2px;">${value}</div>
    </div>`;

  return `
    <div style="page-break-after:always;margin-bottom:24px;font-family:Inter,sans-serif;">
      <div style="max-width:800px;margin:0 auto;background:#0F2740;padding:12px;border-radius:26px;">
        <div style="background:#FAF6EC;border:2px solid #C9A227;border-radius:18px;padding:30px 34px 26px;position:relative;">

          <!-- Header: crest, school name + tagline, medal -->
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;">
            <div style="flex-shrink:0;width:64px;height:64px;">
              ${dmcLogo
                ? `<img src="${dmcLogo}" style="width:64px;height:64px;object-fit:contain;border-radius:50%;">`
                : `<svg viewBox="0 0 64 64" width="64" height="64"><path d="M32 4 L58 12 V32 C58 46 47 56 32 60 C17 56 6 46 6 32 V12 Z" fill="#0F2740" stroke="#C9A227" stroke-width="2"/><circle cx="32" cy="26" r="10" fill="none" stroke="#E4C765" stroke-width="1.5"/><path d="M24 40 L40 40" stroke="#E4C765" stroke-width="1.5"/></svg>`}
            </div>
            <div style="flex:1;text-align:center;padding-top:4px;">
              <div style="font-family:Fraunces,serif;font-weight:700;font-size:23px;color:#0F2740;line-height:1.2;">${esc(dmcSchoolName)}</div>
              ${dmcTagline ? `<div style="font-family:Fraunces,serif;font-style:italic;font-size:12px;color:#0F2740;opacity:.7;margin-top:5px;">${esc(dmcTagline)}</div>` : ''}
            </div>
            <div style="flex-shrink:0;width:44px;height:56px;">
              <svg viewBox="0 0 44 56" width="44" height="56"><path d="M6 0 H38 V34 L22 24 L6 34 Z" fill="#0F2740"/><circle cx="22" cy="16" r="12" fill="#E4C765" stroke="#C9A227" stroke-width="1.5"/><path d="M16 16 L20 20 L28 11" stroke="#0F2740" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>

          <div style="height:1px;background:linear-gradient(90deg,transparent,#C9A227,transparent);margin:16px 0 18px;"></div>

          <!-- Title banner -->
          <div style="text-align:center;">
            <div style="display:inline-block;background:#0F2740;color:#FAF6EC;padding:9px 24px;border-radius:6px;font-weight:700;font-size:14px;letter-spacing:.05em;">DETAILED MARKS CERTIFICATE</div>
            ${dmcAcademicSession ? `<div style="margin-top:8px;"><span style="display:inline-block;background:#E4C765;color:#0F2740;padding:4px 16px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.04em;">ACADEMIC SESSION ${esc(dmcAcademicSession)}</span></div>` : ''}
          </div>

          <!-- Position | Student | Class -->
          <div style="display:flex;align-items:center;justify-content:space-between;margin:24px 0 6px;gap:8px;">
            <div style="text-align:center;flex-shrink:0;">
              <div style="font-size:11px;color:#0F2740;opacity:.75;">Position</div>
              <div style="font-size:20px;font-weight:700;color:#0F2740;">${position}</div>

                <th style="padding:12px;text-align:center;font-weight:700;font-size:12px;letter-spacing:.04em;">OBTAINED</th>

              </tr>
            </thead>
            <tbody>
              ${subjectsHtml}
              <tr style="background:#E4C765;font-weight:700;">
                <td style="padding:12px 14px;text-align:left;color:#0F2740;">TOTAL</td>
                <td style="padding:12px;text-align:center;color:#0F2740;font-size:16px;">${totalObtained}</td>
                <td style="padding:12px;text-align:center;color:#0F2740;font-size:16px;">${totalPossible}</td>
              </tr>
            </tbody>
          </table>

          <!-- Stats row -->
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px;background:#F0EBDA;border-radius:10px;border:1px solid #E7E0CE;">
            ${statBlock('📊','Percentage', percentage+'%')}
            ${statBlock('⭐','Grade', grade)}
            ${statBlock('🏅','Out of', totalStudentsInClass)}
            ${statBlock('💬','Remarks', remark)}
          </div>

          <!-- Footer: quote + signature -->
          <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:26px;gap:16px;">

            </div>
            <div style="text-align:center;flex-shrink:0;">

}

function handleDMCLogoUpload(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    dmcLogo = e.target.result;
    saveDMCConfig();
    renderTab();
  };
  reader.readAsDataURL(file);
}

function printAllDMC() {
  if (dmcResults.length === 0) { alert('No results to print'); return; }
  let html = '<html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"><style>*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important;}body{font-family:Inter,sans-serif;margin:0;padding:10px;background:#f5f5f5;}@media print{body{background:#fff;}}</style></head><body>';
  dmcResults.forEach(r => {
    html += renderDMCCertificate(r);
  });
  html += '</body></html>';
  const w = window.open('', '', 'height=900,width=800');
  w.document.write(html);
  w.document.close();
  setTimeout(() => w.print(), 500);
}

// --------- MARKS SHEET (Independent - separate from Students database) ---------
let msClasses = ['Nursery', 'KG', '1st', '2nd', '3rd']; // independent class list
let msStudents = {}; // {className: [{id, name}, ...]}
let msSubjects = []; // independent subject list
let msMarksData = {}; // {className: {studentId: {subject: marks}}}
let msSelectedClass = '';
let msNewStudentName = '';
let msLoaded = false;
let msSaveTimer = null;

async function loadMarksSheetData() {
  if (msLoaded) return;
  msLoaded = true;
  const { data } = await sb.from('marks_sheet_data').select('*').eq('owner_id', CURRENT_USER.id).maybeSingle();
  if (data) {
    msClasses = data.classes && data.classes.length ? data.classes : msClasses;
    msSubjects = data.subjects || [];
    msStudents = data.students || {};
    msMarksData = data.marks || {};
  }
}

// Debounced save so rapid marks entry (many onchange events) doesn't spam the database.
function saveMarksSheetData() {
  clearTimeout(msSaveTimer);
  msSaveTimer = setTimeout(async () => {
    const { error } = await sb.from('marks_sheet_data').upsert({
      owner_id: CURRENT_USER.id, classes: msClasses, subjects: msSubjects,
      students: msStudents, marks: msMarksData, updated_at: new Date().toISOString()
    });
    if (error) console.error('Marks sheet save failed:', error.message);
  }, 500);
}

function tplMarksSheet() {
  if (!msLoaded) { loadMarksSheetData().then(renderTab); return `<div style="padding:20px;text-align:center;opacity:.6;">${esc(t.loading||'Loading...')}</div>`; }
  if (!msSelectedClass && msClasses.length) msSelectedClass = msClasses[0];
  
  const classStudents = msStudents[msSelectedClass] || [];
  
  let tableHtml = '';
  if (classStudents.length > 0) {
    tableHtml = `
      <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px;">
        <thead>
          <tr style="background:#0F2740;color:#fff;position:sticky;top:0;">
            <th style="padding:8px;text-align:left;min-width:150px;">Student Name</th>
            <th style="padding:8px;text-align:left;min-width:150px;">Father Name</th>
            ${msSubjects.map(s => `<th style="padding:8px;text-align:center;min-width:80px;">${esc(s)}</th>`).join('')}
            <th style="padding:8px;text-align:center;min-width:60px;">Action</th>
          </tr>
        </thead>
        <tbody>
    `;
    
    classStudents.forEach((student, idx) => {
      if (!msMarksData[msSelectedClass]) msMarksData[msSelectedClass] = {};
      if (!msMarksData[msSelectedClass][student.id]) msMarksData[msSelectedClass][student.id] = {};
      
      tableHtml += `<tr style="border-bottom:1px solid #ddd;">
        <td style="padding:8px;text-align:left;font-weight:500;">${esc(student.name)}</td>
        <td style="padding:4px;"><input type="text" value="${esc(student.fatherName||'')}" placeholder="Father Name" style="width:100%;padding:4px;border:1px solid #ccc;" onchange="msStudents['${msSelectedClass}'][${idx}].fatherName=this.value;saveMarksSheetData();"></td>
        ${msSubjects.map(subj => {
          const val = msMarksData[msSelectedClass][student.id][subj] || '';
          return `<td style="padding:4px;"><input type="number" value="${val}" placeholder="—" style="width:100%;text-align:center;padding:4px;border:1px solid #ccc;" onchange="msMarksData['${msSelectedClass}']['${student.id}']['${subj}']=this.value;saveMarksSheetData();"></td>`;
        }).join('')}
        <td style="padding:4px;text-align:center;"><button class="btn-ghost" style="padding:0;font-size:11px;" onclick="removeMarksSheetStudent('${msSelectedClass}', ${idx})">✕</button></td>
      </tr>`;
    });
    
    tableHtml += `</tbody></table>`;
  }
  
  return `
    <h2>📋 Marks Sheet (Independent)</h2>
    
    <div class="card">
      <h3 style="margin-top:0;">Classes</h3>
      <p style="font-size:11px;opacity:.6;">Add or remove classes</p>
      <div style="display:flex;gap:6px;margin-bottom:8px;">
        <input type="text" id="ms-new-class" placeholder="Class Name (e.g., 1st, 2nd)" style="flex:1;">
        <button class="btn-ghost" onclick="addMarksSheetClass()">+ Add</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">
        ${msClasses.map((c, i) => `
          <div style="background:#F0EBDA;padding:6px 10px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:6px;">

          <div style="background:#F0EBDA;padding:6px 10px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:6px;">
            ${esc(s)}

    </div>

    ${msSelectedClass ? `
    <div class="card">
      <h3 style="margin-top:0;">Class: ${esc(msSelectedClass)}</h3>
      <p style="font-size:11px;opacity:.6;">Add students and enter marks</p>
      
      <div style="display:flex;gap:6px;margin-bottom:12px;">

      ${classStudents.length ? tableHtml : '<p style="opacity:.5;text-align:center;padding:20px;">No students yet. Add a student above.</p>'}
      
      ${classStudents.length && msSubjects.length ? `

}

function addMarksSheetClass() {
  const input = document.getElementById('ms-new-class');
  const cls = input.value.trim();
  if (!cls) return;
  if (!msClasses.includes(cls)) {
    msClasses.push(cls);
    msStudents[cls] = [];
    msMarksData[cls] = {};
    msSelectedClass = cls;
  }
  input.value = '';
  saveMarksSheetData();
  renderTab();
}

function removeMarksSheetClass(idx) {
  const cls = msClasses[idx];
  msClasses.splice(idx, 1);
  delete msStudents[cls];
  delete msMarksData[cls];
  if (msSelectedClass === cls) msSelectedClass = msClasses[0] || '';
  saveMarksSheetData();
  renderTab();
}

function addMarksSheetSubject() {
  const input = document.getElementById('ms-new-subject');
  const subj = input.value.trim();
  if (!subj) return;
  if (!msSubjects.includes(subj)) {
    msSubjects.push(subj);
  }
  input.value = '';
  saveMarksSheetData();
  renderTab();
}

function addMarksSheetStudent() {
  const input = document.getElementById('ms-student-input');
  const fatherInput = document.getElementById('ms-father-input');
  const name = input.value.trim();
  const fatherName = fatherInput ? fatherInput.value.trim() : '';
  if (!name || !msSelectedClass) return;
  
  if (!msStudents[msSelectedClass]) msStudents[msSelectedClass] = [];
  if (!msMarksData[msSelectedClass]) msMarksData[msSelectedClass] = {};
  
  const id = Math.random().toString(36).substr(2, 9);
  msStudents[msSelectedClass].push({id, name, fatherName});
  msMarksData[msSelectedClass][id] = {};
  
  input.value = '';
  if (fatherInput) fatherInput.value = '';
  saveMarksSheetData();
  renderTab();
}

function removeMarksSheetStudent(cls, idx) {
  const student = msStudents[cls][idx];
  msStudents[cls].splice(idx, 1);
  delete msMarksData[cls][student.id];
  saveMarksSheetData();
  renderTab();
}

function exportMarksSheetExcel(className) {
  const classStudents = msStudents[className] || [];
  if (!classStudents.length || !msSubjects.length) return;

  const rows = classStudents.map(student => {
    const row = { 'Student Name': student.name, 'Father Name': student.fatherName || '' };
    let total = 0;
    msSubjects.forEach(subj => {
      const val = (msMarksData[className] && msMarksData[className][student.id] && msMarksData[className][student.id][subj]) || '';
      row[subj] = val === '' ? '' : Number(val);
      total += Number(val) || 0;
    });
    row['Total'] = total;
    return row;
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  // Bold header row
  const headerRange = XLSX.utils.decode_range(ws['!ref']);
  for (let c = headerRange.s.c; c <= headerRange.e.c; c++) {
    const addr = XLSX.utils.encode_cell({ r: 0, c });
    if (ws[addr]) ws[addr].s = { font: { bold: true } };
  }
  ws['!cols'] = [{ wch: 24 }, { wch: 24 }, ...msSubjects.map(() => ({ wch: 12 })), { wch: 10 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, className.slice(0, 31) || 'Marks Sheet');

  const schoolPart = (CURRENT_PROFILE?.school_name || 'School').replace(/[^a-zA-Z0-9]/g, '_');
  XLSX.writeFile(wb, `${schoolPart}_MarksSheet_${className}_${todayISO()}.xlsx`, { cellStyles: true });
}

// Prints a single admission entry as a formal School Leaving Certificate (SLC),
// using the standard wording/fields expected on this document in Pakistani schools.
function printAdmissionEntry(id) {
  const r = DATA.admissionRegister.find(x => x.id === id);
  if (!r) return;
  const dash = '—';
  const fieldsHtml = [
    [t.serialNo, r.serial_no || dash],
    [t.admissionDate, r.admission_date || dash],
    [t.studentName, r.student_name || dash],
    [t.fatherName, r.father_name || dash],
    [t.dobFigures, r.dob_figures || dash],
    [t.dobWords, r.dob_words || dash],
    [t.religion, r.religion || dash],
    [t.nationality, r.nationality || dash],
    [t.casteTribe, r.caste_tribe || dash],
    [t.occupation, r.occupation || dash],
    [t.residence, r.residence || dash],
    [t.classAdmitted, r.class_admitted || dash],
    [t.arrearsDue, '₨' + fmt(r.arrears_due || 0)],
    [t.conduct, r.conduct || dash],
    [t.classWithdrawn, r.class_withdrawn || dash],
    [t.withdrawalDate, r.withdrawal_date || dash],
  ].map(([lbl,val]) => `<div class="slc-field"><span class="lbl">${esc(lbl)}</span><span class="val">${esc(val)}</span></div>`).join('');

  document.getElementById('print-area').innerHTML = `
    <div class="slc-print">
      <div class="slc-head">
        <h2>${esc(CURRENT_PROFILE.school_name || 'School')}</h2>
        <div class="slc-title">${esc(t.slcTitle)}</div>
      </div>
      <div class="slc-meta">
        <span>${esc(t.slcNo)}: ${esc(r.serial_no || dash)}</span>
        <span>${esc(t.slcIssueDate)}: ${esc(todayISO())}</span>
      </div>
      <div class="slc-fields">${fieldsHtml}</div>
      ${r.remarks ? `<p class="slc-remarks" style="padding:0 34px;">${esc(t.remarks)}: ${esc(r.remarks)}</p>` : ''}
      <div class="slc-sign">
        <div class="box"><div class="line"></div>${esc(t.slcSignature)}</div>
      </div>
    </div>`;
  window.print();
}

function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

function confirmDelete(kind, id) {
  showModal(t.delete, `
    <p style="font-size:14px;">${esc(t.confirmDelete)}</p>
    <div class="flexgap">
      <button class="btn-ghost" onclick="closeModal()">${esc(t.no)}</button>
      <button class="btn-primary" style="flex:1;background:var(--rust);" onclick="doDelete('${kind}','${id}')">${esc(t.yes)}</button>
    </div>
  `);
}
async function doDelete(kind, id) {
  // Delete dependent ledger rows first so a missing FK-cascade rule on the
  // database can't silently block the delete or leave orphaned payment records.
  let err = null;
  if (kind==='student') {
    const r1 = await sb.from('fee_payments').delete().eq('student_id', id);
    if (r1.error) err = r1.error;
    const r2 = await sb.from('students').delete().eq('id', id);
    if (r2.error) err = r2.error;
  }
  if (kind==='teacher') {
    const r1 = await sb.from('salary_payments').delete().eq('teacher_id', id);
    if (r1.error) err = r1.error;
    const r2 = await sb.from('teachers').delete().eq('id', id);
    if (r2.error) err = r2.error;
  }
  if (kind==='admissionEntry') {
    const r1 = await sb.from('admission_register').delete().eq('id', id);
    if (r1.error) err = r1.error;
  }
  closeModal(); await loadAllData(); renderTab();
  if (err) alert((LANG==='ur' ? 'حذف کرنے میں خرابی: ' : 'Delete failed: ') + err.message);
}

boot();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
