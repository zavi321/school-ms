  document.getElementById('dmc-preview').innerHTML = html;
}

function dmcSubjectIcon(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('eng')) return '🔤';
  if (n.includes('sci')) return '🧪';
  if (n.includes('math') || n.includes('riyazi')) return '🧮';
  if (n.includes('urdu')) return '📖';
  if (n.includes('islam') || n.includes('quran') || n.includes('deen')) return '🕌';
  if (n.includes('gk') || n.includes('general') || n.includes('social') || n.includes('geo')) return '🌍';
  if (n.includes('comp')) return '💻';
  if (n.includes('art') || n.includes('draw')) return '🎨';
  if (n.includes('phys') || n.includes('sport') || n.includes('pt ')) return '⚽';
  return '📘';
}

function dmcGradeFor(pct) {
  return pct >= 90 ? 'A++' : pct >= 80 ? 'A+' : pct >= 70 ? 'A' : pct >= 60 ? 'B' : pct >= 50 ? 'C' : pct >= 40 ? 'D' : 'E';
}
function dmcRemarkFor(grade) {
  const map = { 'A++':'Outstanding', 'A+':'Excellent', 'A':'Very Good', 'B':'Good', 'C':'Satisfactory', 'D':'Needs Improvement', 'E':'Fail' };
  return map[grade] || '';
}

function renderDMCCertificate(result) {
  const totalObtained = dmcSubjects.reduce((a, s) => a + (Number(result.marks[s.name]) || 0), 0);
  const totalPossible = dmcSubjects.reduce((a,b) => a+b.total, 0);
  const percentage = totalPossible ? ((totalObtained / totalPossible) * 100).toFixed(1) : 0;
  const grade = dmcGradeFor(percentage);
  const resultStatus = percentage >= 40 ? 'PASS' : 'FAIL';

  // Position in class
  const classResults = dmcResults.filter(r => r.class === result.class);
  const classTotals = classResults.map(r => dmcSubjects.reduce((a, s) => a + (Number(r.marks[s.name]) || 0), 0));
  const sortedTotals = [...classTotals].sort((a, b) => b - a);
  const position = sortedTotals.indexOf(totalObtained) + 1;

  const subjectsHtml = dmcSubjects.map((s, i) => {
    const marks = Number(result.marks[s.name]) || 0;
    const subjPct = s.total ? (marks / s.total) * 100 : 0;

// --------- MARKS SHEET (Independent - separate from Students database) ---------
let msClasses = ['Nursery', 'KG', '1st', '2nd', '3rd']; // independent class list
let msStudents = {}; // {className: [{id, name}, ...]}
let msSubjects = []; // independent subject list
let msMarksData = {}; // {className: {studentId: {subject: marks}}}
let msSelectedClass = '';
let msNewStudentName = '';
let msLoaded = false;
let msSaveTimer = null;

async function loadMarksSheetData() {
  if (msLoaded) return;
  msLoaded = true;
  const { data } = await sb.from('marks_sheet_data').select('*').eq('owner_id', CURRENT_USER.id).maybeSingle();
  if (data) {
    msClasses = data.classes && data.classes.length ? data.classes : msClasses;
    msSubjects = data.subjects || [];
    msStudents = data.students || {};
    msMarksData = data.marks || {};
  }
}

// Debounced save so rapid marks entry (many onchange events) doesn't spam the database.
function saveMarksSheetData() {
  clearTimeout(msSaveTimer);
  msSaveTimer = setTimeout(async () => {
    const { error } = await sb.from('marks_sheet_data').upsert({
      owner_id: CURRENT_USER.id, classes: msClasses, subjects: msSubjects,
      students: msStudents, marks: msMarksData, updated_at: new Date().toISOString()
    });
    if (error) console.error('Marks sheet save failed:', error.message);
  }, 500);
}

function tplMarksSheet() {
  if (!msLoaded) { loadMarksSheetData().then(renderTab); return `<div style="padding:20px;text-align:center;opacity:.6;">${esc(t.loading||'Loading...')}</div>`; }
  if (!msSelectedClass && msClasses.length) msSelectedClass = msClasses[0];
  
  const classStudents = msStudents[msSelectedClass] || [];
  
  let tableHtml = '';
  if (classStudents.length > 0) {
    tableHtml = `
      <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px;">
        <thead>
          <tr style="background:#0F2740;color:#fff;position:sticky;top:0;">
            <th style="padding:8px;text-align:left;min-width:150px;">Student Name</th>
            <th style="padding:8px;text-align:left;min-width:150px;">Father Name</th>
            ${msSubjects.map(s => `<th style="padding:8px;text-align:center;min-width:80px;">${esc(s)}</th>`).join('')}
            <th style="padding:8px;text-align:center;min-width:60px;">Action</th>
          </tr>
        </thead>
        <tbody>
    `;
    
    classStudents.forEach((student, idx) => {
      if (!msMarksData[msSelectedClass]) msMarksData[msSelectedClass] = {};
      if (!msMarksData[msSelectedClass][student.id]) msMarksData[msSelectedClass][student.id] = {};
      
      tableHtml += `<tr style="border-bottom:1px solid #ddd;">
        <td style="padding:8px;text-align:left;font-weight:500;">${esc(student.name)}</td>
        <td style="padding:4px;"><input type="text" value="${esc(student.fatherName||'')}" placeholder="Father Name" style="width:100%;padding:4px;border:1px solid #ccc;" onchange="msStudents['${msSelectedClass}'][${idx}].fatherName=this.value;saveMarksSheetData();"></td>
        ${msSubjects.map(subj => {
          const val = msMarksData[msSelectedClass][student.id][subj] || '';
          return `<td style="padding:4px;"><input type="number" value="${val}" placeholder="—" style="width:100%;text-align:center;padding:4px;border:1px solid #ccc;" onchange="msMarksData['${msSelectedClass}']['${student.id}']['${subj}']=this.value;saveMarksSheetData();"></td>`;
        }).join('')}
        <td style="padding:4px;text-align:center;"><button class="btn-ghost" style="padding:0;font-size:11px;" onclick="removeMarksSheetStudent('${msSelectedClass}', ${idx})">✕</button></td>
      </tr>`;
    });
    
    tableHtml += `</tbody></table>`;
  }
  
  return `
    <h2>📋 Marks Sheet (Independent)</h2>
    
    <div class="card">
      <h3 style="margin-top:0;">Classes</h3>
      <p style="font-size:11px;opacity:.6;">Add or remove classes</p>
      <div style="display:flex;gap:6px;margin-bottom:8px;">
        <input type="text" id="ms-new-class" placeholder="Class Name (e.g., 1st, 2nd)" style="flex:1;">
        <button class="btn-ghost" onclick="addMarksSheetClass()">+ Add</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">
        ${msClasses.map((c, i) => `
          <div style="background:#F0EBDA;padding:6px 10px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:6px;">
            <button style="background:none;border:none;padding:0;cursor:pointer;font-weight:${c===msSelectedClass?'bold':'normal'};color:${c===msSelectedClass?'#0F2740':'inherit'};" onclick="msSelectedClass='${c}';renderTab();">${esc(c)}</button>
            <button class="btn-ghost" style="padding:0;font-size:10px;opacity:.6;" onclick="removeMarksSheetClass(${i})">✕</button>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Subjects</h3>
      <p style="font-size:11px;opacity:.6;">Add or remove subjects for this marks sheet</p>
      <div style="display:flex;gap:6px;margin-bottom:8px;">
        <input type="text" id="ms-new-subject" placeholder="Subject Name (e.g., Urdu, Math)" style="flex:1;">
        <button class="btn-ghost" onclick="addMarksSheetSubject()">+ Add</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        ${msSubjects.map((s, i) => `
          <div style="background:#F0EBDA;padding:6px 10px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:6px;">
            ${esc(s)}
            <button class="btn-ghost" style="padding:0;font-size:10px;opacity:.6;" onclick="msSubjects.splice(${i},1);saveMarksSheetData();renderTab();">✕</button>
          </div>
        `).join('')}
      </div>
    </div>

    ${msSelectedClass ? `
    <div class="card">
      <h3 style="margin-top:0;">Class: ${esc(msSelectedClass)}</h3>
      <p style="font-size:11px;opacity:.6;">Add students and enter marks</p>
      
      <div style="display:flex;gap:6px;margin-bottom:12px;">
        <input type="text" id="ms-student-input" placeholder="Student Name" style="flex:1;">
        <input type="text" id="ms-father-input" placeholder="Father Name" style="flex:1;">
        <button class="btn-ghost" onclick="addMarksSheetStudent()">+ Add Student</button>
      </div>
      
      ${classStudents.length ? tableHtml : '<p style="opacity:.5;text-align:center;padding:20px;">No students yet. Add a student above.</p>'}
      
      ${classStudents.length && msSubjects.length ? `
        <button class="btn-ghost" onclick="printMarksSheet('${msSelectedClass}')">🖨️ Print</button>
        <button class="btn-ghost" onclick="exportMarksSheetExcel('${msSelectedClass}')">📊 Export to Excel</button>
      ` : ''}
    </div>
    ` : ''}
  `;
}

function addMarksSheetClass() {
  const input = document.getElementById('ms-new-class');
  const cls = input.value.trim();
  if (!cls) return;
  if (!msClasses.includes(cls)) {
    msClasses.push(cls);
    msStudents[cls] = [];
    msMarksData[cls] = {};
    msSelectedClass = cls;
  }
  input.value = '';
  saveMarksSheetData();
  renderTab();
}

function removeMarksSheetClass(idx) {
  const cls = msClasses[idx];
  msClasses.splice(idx, 1);
  delete msStudents[cls];
  delete msMarksData[cls];
  if (msSelectedClass === cls) msSelectedClass = msClasses[0] || '';
  saveMarksSheetData();
  renderTab();
}

function addMarksSheetSubject() {
  const input = document.getElementById('ms-new-subject');
  const subj = input.value.trim();
  if (!subj) return;
  if (!msSubjects.includes(subj)) {
    msSubjects.push(subj);
  }
  input.value = '';
  saveMarksSheetData();
  renderTab();
}

function addMarksSheetStudent() {
  const input = document.getElementById('ms-student-input');
  const fatherInput = document.getElementById('ms-father-input');
  const name = input.value.trim();
  const fatherName = fatherInput ? fatherInput.value.trim() : '';
  if (!name || !msSelectedClass) return;
  
  if (!msStudents[msSelectedClass]) msStudents[msSelectedClass] = [];
  if (!msMarksData[msSelectedClass]) msMarksData[msSelectedClass] = {};
  
  const id = Math.random().toString(36).substr(2, 9);
  msStudents[msSelectedClass].push({id, name, fatherName});
  msMarksData[msSelectedClass][id] = {};
  
  input.value = '';
  if (fatherInput) fatherInput.value = '';
  saveMarksSheetData();
  renderTab();
}

function removeMarksSheetStudent(cls, idx) {
  const student = msStudents[cls][idx];
  msStudents[cls].splice(idx, 1);
  delete msMarksData[cls][student.id];
  saveMarksSheetData();
  renderTab();
}

function exportMarksSheetExcel(className) {
  const classStudents = msStudents[className] || [];
  if (!classStudents.length || !msSubjects.length) return;

  const rows = classStudents.map(student => {
    const row = { 'Student Name': student.name, 'Father Name': student.fatherName || '' };
    let total = 0;
    msSubjects.forEach(subj => {
      const val = (msMarksData[className] && msMarksData[className][student.id] && msMarksData[className][student.id][subj]) || '';
      row[subj] = val === '' ? '' : Number(val);
      total += Number(val) || 0;
    });
    row['Total'] = total;
    return row;
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  // Bold header row
  const headerRange = XLSX.utils.decode_range(ws['!ref']);
  for (let c = headerRange.s.c; c <= headerRange.e.c; c++) {
    const addr = XLSX.utils.encode_cell({ r: 0, c });
    if (ws[addr]) ws[addr].s = { font: { bold: true } };
  }
  ws['!cols'] = [{ wch: 24 }, { wch: 24 }, ...msSubjects.map(() => ({ wch: 12 })), { wch: 10 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, className.slice(0, 31) || 'Marks Sheet');

  const schoolPart = (CURRENT_PROFILE?.school_name || 'School').replace(/[^a-zA-Z0-9]/g, '_');
  XLSX.writeFile(wb, `${schoolPart}_MarksSheet_${className}_${fmtDate(todayISO())}.xlsx`, { cellStyles: true });
}

// Admission & Withdrawal Register page, so every saved entry appears as a row

// Admitted/SLC list view) instead of one-at-a-time cards.
function registerLedgerTableHtml(rows) {
  const dobText = r => {
    const parts = [r.dob_words, fmtDate(r.dob_figures)].filter(Boolean);
    return parts.length ? esc(parts.join(' — ')) : '—';
  };
  const headCols = [
    t.admissionDate, t.serialNo, t.studentName, t.dobLabel, t.fatherName,
    t.casteTribe, t.occupation, t.residence, t.classAdmitted, t.arrearsDue,
    t.classWithdrawn, t.withdrawalDate, t.remarks, ''
  ];
  const SPINE_AFTER = 4; // after Father's Name column, matching the book's fold

  const dataRow = r => `
    <tr onclick="openEditAdmissionEntry('${r.id}')">
      <td>${esc(fmtDate(r.admission_date)||'—')}</td>
      <td>${esc(r.serial_no||'—')}</td>
      <td class="mo">${esc(r.student_name||'—')}</td>
      <td>${dobText(r)}</td>
      <td class="rb-spine">${esc(r.father_name||'—')}</td>
      <td>${esc(r.caste_tribe||'—')}</td>
      <td>${esc(r.occupation||'—')}</td>
      <td>${esc(r.residence||'—')}</td>
      <td>${esc(r.class_admitted||'—')}</td>
      <td class="${Number(r.arrears_due||0) ? 'due' : ''}">${Number(r.arrears_due||0) ? '₨'+fmt(r.arrears_due) : '—'}</td>
      <td>${esc(r.class_withdrawn||'—')}</td>
      <td>${esc(fmtDate(r.withdrawal_date)||'—')}</td>
      <td>${esc(r.remarks||'—')}</td>
      <td class="act">${r.withdrawal_date ? `<span class="print-btn" title="${esc(t.print)}" onclick="event.stopPropagation(); printAdmissionEntry('${r.id}')">🖨️</span>` : ''}<span class="print-btn" title="${esc(t.printCc)}" onclick="event.stopPropagation(); printCharacterCertificate('${r.id}')">📜</span></td>
    </tr>`;

  if (rows.length === 0) return `<div class="empty">${esc(t.noRegisterEntries)}</div>`;
  return `
    <div class="regbook-screen-wrap">
      <table class="regbook-screen">
        <thead><tr>${headCols.map((c,i) => `<th${i===SPINE_AFTER?' class="rb-spine"':''}>${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(dataRow).join('')}</tbody>

    </div>`;
}

// Prints one page (up to 30 rows) of the register as a single ledger-style table,
// matching the columns/layout of the physical Admission & Withdrawal Register book.
function printAdmissionRegisterPage(page) {
  const full = filteredRegisterList();
  const start = (page - 1) * REGISTER_PAGE_SIZE;
  const rows = full.slice(start, start + REGISTER_PAGE_SIZE);
  if (rows.length === 0) return;

  const headCols = [
    t.admissionDate, t.serialNo, t.studentName, t.dobLabel, t.fatherName,
    t.casteTribe, t.occupation, t.residence, t.classAdmitted, t.arrearsDue,
    t.classWithdrawn, t.withdrawalDate, t.remarks
  ];
  const SPINE_AFTER = 5; // book fold falls after Father's Name (5th column)
  const headerHtml = headCols.map((c,i) => `<th${i===SPINE_AFTER?' class="rb-spine"':''}>${esc(c)}</th>`).join('');

  const dobText = r => {
    const parts = [fmtDate(r.dob_figures), r.dob_words].filter(Boolean);
    return parts.length ? esc(parts.join(' — ')) : '—';
  };
  const dataRow = r => `
    <tr>
      <td>${esc(fmtDate(r.admission_date)||'—')}</td>
      <td>${esc(r.serial_no||'—')}</td>
      <td>${esc(r.student_name||'—')}</td>
      <td>${dobText(r)}</td>
      <td>${esc(r.father_name||'—')}</td>
      <td class="rb-spine">${esc(r.caste_tribe||'—')}</td>
      <td>${esc(r.occupation||'—')}</td>
      <td>${esc(r.residence||'—')}</td>
      <td>${esc(r.class_admitted||'—')}</td>
      <td>${Number(r.arrears_due||0) ? '₨'+fmt(r.arrears_due) : '—'}</td>
      <td>${esc(r.class_withdrawn||'—')}</td>
      <td>${esc(fmtDate(r.withdrawal_date)||'—')}</td>
      <td>${esc(r.remarks||'—')}</td>
    </tr>`;
  const blankRow = `<tr>${headCols.map((_,i)=>`<td${i===SPINE_AFTER?' class="rb-spine"':''}>&nbsp;</td>`).join('')}</tr>`;
  const bodyRows = rows.map(dataRow).join('') + blankRow.repeat(Math.max(0, REGISTER_PAGE_SIZE - rows.length));

  document.getElementById('print-area').innerHTML = `
    <div class="regbook-print">
      <div class="rb-head">
        <h2>${esc(t.admissionRegister)}</h2>
        <span class="rb-of">${LANG==='ur' ? 'کے' : 'of the'}</span>
        <span class="rb-school">${esc(CURRENT_PROFILE.school_name || 'School')}</span>
      </div>
      <div class="rb-meta">Page ${page} &nbsp;·&nbsp; ${esc(fmtDate(todayISO()))}</div>
      <table>
        <thead><tr>${headerHtml}</tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
      <div class="foot">
        <div class="note">Note: The age entries should be recorded in words and figures, and any change in sub entries should be attested.</div>
        <div class="sign">${esc(t.headOfInstitution || 'Head of the Institution')}</div>
      </div>
    </div>`;
  printWithOrientation('landscape');
}

// Temporarily overrides the page orientation for a single print job (the wide
// ledger table needs landscape while every other print — receipts, SLC,
// character certificate — should stay portrait), then removes the override
// right after so later prints aren't affected.
function printWithOrientation(orientation) {
  const styleEl = document.createElement('style');
  styleEl.id = 'print-orientation-override';
  styleEl.textContent = `@media print { @page{ size:${orientation}; margin:8mm; } }`;
  document.head.appendChild(styleEl);
  const cleanup = () => { styleEl.remove(); window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  window.print();
  setTimeout(cleanup, 3000); // fallback in case afterprint doesn't fire
}

// Forces the page size to A4 portrait for a single print job regardless of
// whatever paper size the device/printer driver defaults to (e.g. "Letter"
// on some Android/Chrome print dialogs). The SLC and Character Certificate
// are laid out to exact A4-minus-10mm-margin dimensions (190mm x 277mm), so
// without this override a different default paper size makes the
// certificate taller than the printable area and spill onto a second page.
function printAsA4(marginMm) {
  const styleEl = document.createElement('style');
  styleEl.id = 'print-pagesize-override';
  styleEl.textContent = `@media print { @page{ size:A4 portrait; margin:${marginMm || 10}mm; } }`;
  document.head.appendChild(styleEl);
  const cleanup = () => { styleEl.remove(); window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  window.print();
  setTimeout(cleanup, 3000);
}

// Prints a single admission entry as a formal School Leaving Certificate (SLC).
// The certificate is written as a narrative paragraph (not a bare field list),
// with every actual record value (names, dates, numbers) bolded within the
// otherwise italic certificate text so they stand out at a glance.
function rec(val, dash) {
  // Wraps a record value in a bold span; falls back to a plain dash if empty.
  return val ? `<b class="rec">${esc(val)}</b>` : `<b class="rec">${esc(dash)}</b>`;
}

function slcParagraphEn(r, dash) {
  const rel = 'S/O, D/O';
  return `
    This is to certify that ${rec(r.student_name, dash)} ${rel} ${rec(r.father_name, dash)},
    resident of ${rec(r.residence, dash)}, bearing Serial No. ${rec(r.serial_no, dash)} in the
    Admission &amp; Withdrawal Register of this institution, was admitted on ${rec(fmtDate(r.admission_date), dash)}
    in Class ${rec(r.class_admitted, dash)}. As per the register, his/her date of birth is
    ${rec(r.dob_words, dash)} (${rec(fmtDate(r.dob_figures), dash)}), and he/she was struck off the rolls
    on ${rec(fmtDate(r.withdrawal_date), dash)}. During the period of study, his/her conduct remained
    ${rec(r.conduct || 'Good', dash)}. This certificate is issued at his/her request for whatever purpose it may serve.
  `;
}

function slcParagraphUr(r, dash) {
  const rel = 'ولد، بنتِ';
  return `
    یہ تصدیق کی جاتی ہے کہ ${rec(r.student_name_ur || r.student_name, dash)} ${rel} ${rec(r.father_name_ur || r.father_name, dash)}،

// Character Certificate — narrative paragraph (same record-value-in-bold treatment
// as the SLC) but focused purely on conduct/character rather than admission &
// withdrawal, and usable for currently-enrolled as well as left students.
// CLASS_OPTIONS is a fixed dropdown, so unlike free-text names/addresses this can
// be translated automatically — no manual Urdu entry needed for class names.
const CLASS_NAME_UR = {
  'Nursery':'نرسری', 'KG':'کے جی', '1st':'اول', '2nd':'دوم', '3rd':'سوم', '4th':'چہارم',
  '5th':'پنجم', '6th':'ششم', '7th':'ہفتم', '8th':'ہشتم', '9th':'نہم', '10th':'دہم',
  '11th':'گیارہویں', '12th':'بارہویں'
};
function classNameUrdu(c) { return CLASS_NAME_UR[c] || c; }

function ccParagraphEn(r, dash) {
  const rel = 'S/O, D/O';
  const studyLine = r.class_withdrawn
    ? `and remained on the rolls of this institution up to Class ${rec(r.class_withdrawn, dash)}, from which he/she was struck off on ${rec(fmtDate(r.withdrawal_date), dash)}`
    : `and is currently studying in Class ${rec(r.class_admitted, dash)} at this institution`;
  return `
    This is to certify that ${rec(r.student_name, dash)} ${rel} ${rec(r.father_name, dash)},
    Caste/Tribe ${rec(r.caste_tribe, dash)}, resident of ${rec(r.residence, dash)}, bearing
    Serial No. ${rec(r.serial_no, dash)} in the Admission &amp; Withdrawal Register of this institution,
    was admitted on ${rec(fmtDate(r.admission_date), dash)} in Class ${rec(r.class_admitted, dash)}, ${studyLine}.
    During the entire period of his/her stay at this institution, his/her character and conduct
    remained ${rec(r.conduct || 'Good', dash)}, and he/she was never found involved in any activity
    prejudicial to the discipline or moral atmosphere of the institution. This certificate is issued
    on his/her request for whatever purpose it may serve.
  `;
}

function ccParagraphUr(r, dash) {
  const rel = 'ولد، بنتِ';
  const studyLine = r.class_withdrawn
    ? `اور اس ادارے میں جماعت ${rec(classNameUrdu(r.class_withdrawn), dash)} تک زیرِ تعلیم رہے، اور تاریخ ${rec(fmtDate(r.withdrawal_date), dash)} کو رجسٹر سے خارج ہوئے`
    : `اور فی الحال اس ادارے میں جماعت ${rec(classNameUrdu(r.class_admitted), dash)} میں زیرِ تعلیم ہیں`;
  return `
    یہ تصدیق کی جاتی ہے کہ ${rec(r.student_name_ur || r.student_name, dash)} ${rel} ${rec(r.father_name_ur || r.father_name, dash)}،
    ذات/قبیلہ ${rec(r.caste_tribe_ur || r.caste_tribe, dash)}، ساکن ${rec(r.residence_ur || r.residence, dash)}، جو اس ادارے کے داخلہ و اخراج
    رجسٹر میں سیریل نمبر ${rec(r.serial_no, dash)} پر درج ہے، کو تاریخ ${rec(fmtDate(r.admission_date), dash)}
    کو جماعت ${rec(classNameUrdu(r.class_admitted), dash)} میں داخل کیا گیا تھا، ${studyLine}۔ اس ادارے میں قیام کے پورے
    عرصے کے دوران موصوف/موصوفہ کا اخلاق و کردار ${rec(r.conduct || 'اچھا', dash)} رہا، اور وہ کبھی بھی
    ادارے کے نظم و ضبط یا اخلاقی ماحول کے منافی کسی سرگرمی میں ملوث نہیں پائے گئے۔ یہ سرٹیفکیٹ ان کی
    درخواست پر، جہاں ضرورت ہو استعمال کے لیے، جاری کیا جاتا ہے۔
  `;
}

async function doDelete(kind, id) {
  // Delete dependent ledger rows first so a missing FK-cascade rule on the
  // database can't silently block the delete or leave orphaned payment records.
  let err = null;
  if (kind==='student') {
    const r1 = await sb.from('fee_payments').delete().eq('student_id', id);
    if (r1.error) err = r1.error;
    const r2 = await sb.from('students').delete().eq('id', id);
    if (r2.error) err = r2.error;
  }
  if (kind==='teacher') {
    const r1 = await sb.from('salary_payments').delete().eq('teacher_id', id);
    if (r1.error) err = r1.error;
    const r1b = await sb.from('teacher_attendance').delete().eq('teacher_id', id);
    if (r1b.error) err = r1b.error;
    const r2 = await sb.from('teachers').delete().eq('id', id);
    if (r2.error) err = r2.error;
  }
  if (kind==='admissionEntry') {
    const r1 = await sb.from('admission_register').delete().eq('id', id);
    if (r1.error) err = r1.error;
  }
  if (kind==='whitelistEmail') {
    const r1 = await sb.from('whitelist_emails').delete().eq('email', id);
    if (r1.error) err = r1.error;
  }
  closeModal(); await loadAllData(); renderTab();
  if (err) alert((LANG==='ur' ? 'حذف کرنے میں خرابی: ' : 'Delete failed: ') + err.message);
}

// ---------------- Public QR Check-in (no login — reached via ?checkin=TOKEN) ----------------
const CHECKIN_QUEUE_KEY = 'sms_checkin_queue';
const checkinTeacherListCacheKey = (token) => 'sms_checkin_teachers_' + token;

function getCheckinQueue() {
  try { return JSON.parse(localStorage.getItem(CHECKIN_QUEUE_KEY) || '[]'); } catch(e) { return []; }
}
function setCheckinQueue(q) { localStorage.setItem(CHECKIN_QUEUE_KEY, JSON.stringify(q)); }

async function renderCheckinEntry(token) {
  document.getElementById('loading').classList.add('hidden');
  renderAuthShell(`<div id="checkin-body"><div style="text-align:center;padding:20px 0;opacity:.6;">…</div></div>`);
  await flushCheckinQueue(); // try to clear any older offline check-ins first
  await loadCheckinTeachers(token);
  // Keep trying quietly in the background in case connectivity returns mid-visit.
  window.addEventListener('online', () => flushCheckinQueue());
  setInterval(() => { if (navigator.onLine) flushCheckinQueue(); }, 20000);
}

async function loadCheckinTeachers(token) {
  const body = document.getElementById('checkin-body');
  let teachers = null, schoolName = '';
  if (navigator.onLine) {
    try {
      const { data, error } = await sb.rpc('checkin_get_teachers', { p_token: token });
      if (!error && data && data.length) {
        teachers = data.map(r => ({ id: r.id, name: r.name }));
        schoolName = data[0].school_name || '';
        localStorage.setItem(checkinTeacherListCacheKey(token), JSON.stringify({ teachers, schoolName }));
      } else if (!error && data && data.length === 0) {
        // Valid RPC call, zero rows: either an invalid token or a school with no teachers yet.
        teachers = [];
      }
    } catch(e) { /* fall through to cache below */ }
  }
  if (teachers === null) {
    try {
      const cached = JSON.parse(localStorage.getItem(checkinTeacherListCacheKey(token)) || 'null');
      if (cached) { teachers = cached.teachers; schoolName = cached.schoolName; }
    } catch(e) {}
  }
  if (teachers === null) {
    body.innerHTML = `<p style="font-size:13px;">${esc(t.checkinOfflineNoList)}</p>`;
    return;
  }
  if (!teachers.length) {
    body.innerHTML = `<p style="font-size:13px;">${esc(t.checkinInvalid)}</p>`;
    return;
  }
  const queue = getCheckinQueue();
  const queuedForToken = queue.filter(q => q.token === token).length;
  body.innerHTML = `
    ${schoolName ? `<p style="font-size:12px;opacity:.6;margin-top:0;">${esc(schoolName)}</p>` : ''}
    <p style="font-size:13px;">${esc(t.checkinSelectPrompt)}</p>
    <label><span>${esc(t.teacherName)}</span>
      <select id="checkin-teacher">
        <option value="">${esc(t.checkinChooseTeacher)}</option>
        ${teachers.map(tc => `<option value="${esc(tc.id)}">${esc(tc.name)}</option>`).join('')}
      </select>
    </label>
    <div id="checkin-msg" style="font-size:12px;margin-bottom:8px;"></div>
    <button class="btn-primary" style="width:100%;" onclick="submitCheckin('${token}')">${esc(t.checkinButton)}</button>
    ${queuedForToken ? `<p style="font-size:11px;opacity:.6;margin-top:10px;">${esc(t.checkinOffline)} (${queuedForToken})</p>` : ''}
  `;
}

async function submitCheckin(token) {
  const sel = document.getElementById('checkin-teacher');
  const msg = document.getElementById('checkin-msg');
  const teacherId = sel && sel.value;
  if (!teacherId) return;
  msg.innerHTML = '';

  if (!navigator.onLine) { queueCheckin(token, teacherId); return; }

  try {
    const { data, error } = await sb.rpc('checkin_mark_present', { p_token: token, p_teacher_id: teacherId });
    if (error) throw error;
    // The server decides everything (date, time-of-day, whether it's already
    // marked) — the client never sends or trusts a date/time of its own.
    if (data === 'ok') {
      msg.innerHTML = `<span class="ok">✓ ${esc(t.checkinSuccess)}</span>`;
      sel.disabled = true;
    } else if (data === 'already') {
      msg.innerHTML = `<span class="ok">${esc(t.checkinAlready)}</span>`;
      sel.disabled = true;
    } else if (data === 'closed') {
      msg.innerHTML = `<span class="err">${esc(t.checkinOutsideWindow)}</span>`;
    } else {
      // 'invalid', or an old un-migrated function still returning boolean false.
      msg.innerHTML = `<span class="err">${esc(t.checkinInvalid)}</span>`;
    }
  } catch (e) {
    // Network hiccup even though navigator.onLine said we're online — queue it rather than lose it.
    queueCheckin(token, teacherId);
  }
}

function queueCheckin(token, teacherId) {
  const q = getCheckinQueue();
  q.push({ token, teacherId, ts: Date.now() });
  setCheckinQueue(q);
  const msg = document.getElementById('checkin-msg');
  if (msg) msg.innerHTML = `<span class="ok">${esc(t.checkinOffline)}</span>`;
}

async function flushCheckinQueue() {
  if (!navigator.onLine) return;
  let q = getCheckinQueue();
  if (!q.length) return;
  const remaining = [];
  let lastResult = null; // how the most recently-resolved queued item came back
  for (const item of q) {
    try {
      const { data, error } = await sb.rpc('checkin_mark_present', { p_token: item.token, p_teacher_id: item.teacherId });
      if (error) { remaining.push(item); continue; }
      // 'ok' / 'already' / 'closed' / 'invalid' are all final answers straight from
      // the server's own clock — none of them improve by retrying later, so the
      // queued item is resolved (for better or worse) either way.
      lastResult = data;
    } catch(e) { remaining.push(item); }
  }
  setCheckinQueue(remaining);
  // Refresh the on-screen message if the check-in page is still open.
  const body = document.getElementById('checkin-body');
  if (body && lastResult) {
    const msg = document.getElementById('checkin-msg');
    if (msg) {
      if (lastResult === 'ok' || lastResult === 'already') {
        msg.innerHTML = `<span class="ok">✓ ${esc(t.checkinSuccess)}</span>`;
      } else if (lastResult === 'closed') {
        msg.innerHTML = `<span class="err">${esc(t.checkinOutsideWindow)}</span>`;
      } else {
        msg.innerHTML = `<span class="err">${esc(t.checkinInvalid)}</span>`;
      }
    }
  }
}

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      // Actively check for a newer sw.js/cache on every load, instead of only
      // whenever the browser feels like it — otherwise a freshly-uploaded
      // index.html can keep getting served from an old cached version for a
      // long time on phones that rarely fully close the browser.
      reg.update();
    }).catch(() => {});
  });
}
