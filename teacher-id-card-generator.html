<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher ID Card Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --navy:#0F2740; --navy-deep:#0A1B2C; --gold:#C9A227; --gold-soft:#E9CE7A;
    --ivory:#FBF7EC; --ink:#1C2530; --line:#E7E0CE; --page:#EEF1F4;
  }
  *{box-sizing:border-box;}
  body{font-family:'Inter',Arial,sans-serif;background:var(--page);margin:0;padding:28px 20px;color:var(--ink);}
  .wrap{max-width:920px;margin:0 auto;display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start;}

  .form-col{flex:1;min-width:280px;background:#fff;border-radius:14px;padding:20px 22px;box-shadow:0 1px 3px rgba(15,39,64,.06),0 10px 28px rgba(15,39,64,.07);}
  .form-col .kicker{font-size:10.5px;letter-spacing:.14em;color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:2px;}
  .form-col h2{margin:0 0 16px;font-size:19px;font-family:'Fraunces',serif;font-weight:600;color:var(--navy);}
  .group{border:1px solid var(--line);border-radius:10px;padding:12px 14px 4px;margin-bottom:16px;}
  .group-title{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);opacity:.55;margin-bottom:6px;}
  label{display:block;font-size:12.5px;font-weight:600;margin:10px 0 4px;color:#4A5568;}
  label:first-child{margin-top:0;}
  input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:14px;font-family:inherit;background:#FDFCF8;color:var(--ink);outline:none;transition:border-color .12s ease,box-shadow .12s ease;}
  input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.15);}

  .card-col{flex:0 0 344px;display:flex;flex-direction:column;align-items:center;gap:16px;position:sticky;top:24px;}

  /* ---- ID CARD ---- */
  .id-card{
    width:344px;height:216px;border-radius:16px;background:linear-gradient(135deg,var(--navy),var(--navy-deep));
    background-size:cover;background-position:center;
    color:#fff;position:relative;overflow:hidden;isolation:isolate;
    font-family:'Inter',Arial,sans-serif;
    box-shadow:inset 4px 0 0 0 var(--gold-soft),0 2px 6px rgba(10,20,35,.2),0 14px 30px rgba(10,20,35,.32);
  }
  .id-card::before{
    content:'';position:absolute;inset:0;
    background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.045) 0 2px,transparent 2px 26px);
    pointer-events:none;
  }
  .id-card::after{
    content:'';position:absolute;right:-40px;bottom:-46px;width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);pointer-events:none;
  }
  .id-card .notch{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--page);z-index:2;}

  .card-top{display:flex;align-items:center;gap:9px;padding:15px 16px 9px;position:relative;z-index:1;}
  .card-top .logo-ring{width:32px;height:32px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 0 0 1.5px var(--gold-soft);flex-shrink:0;}
  .card-top .logo-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;}
  .card-top .brand-text{min-width:0;}
  .card-top .sname{font-family:'Fraunces',serif;font-weight:600;font-size:12.5px;line-height:1.15;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-top .tagline{font-size:8px;letter-spacing:.13em;color:var(--gold-soft);margin-top:2px;font-weight:600;text-transform:uppercase;}
  .card-top .role-tag{margin-left:auto;background:var(--gold);color:var(--navy-deep);font-size:8.5px;font-weight:800;letter-spacing:.07em;padding:3px 9px;border-radius:999px;flex-shrink:0;text-transform:uppercase;}

  .card-rule{height:1px;margin:0 16px;background:linear-gradient(90deg,var(--gold-soft),transparent 85%);opacity:.55;position:relative;z-index:1;}

  .card-body{display:flex;gap:12px;padding:11px 16px 0;position:relative;z-index:1;}
  .id-card .photo{width:72px;height:86px;border-radius:8px;object-fit:cover;flex-shrink:0;display:block;background:#233246;border:2px solid var(--gold-soft);box-shadow:0 3px 10px rgba(0,0,0,.3);}
  .card-main{min-width:0;flex:1;padding-top:1px;}
  .card-main .cname{font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;color:#fff;line-height:1.2;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;font-size:10.5px;}
  .info-grid .full{grid-column:1/-1;}
  .info-grid .lbl{display:block;opacity:.55;font-size:8px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:1px;}
  .info-grid b{color:#fff;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .card-footer{position:absolute;left:16px;right:16px;bottom:11px;display:flex;align-items:flex-end;justify-content:space-between;z-index:1;}
  .card-footer .valid{font-size:8px;color:rgba(255,255,255,.62);line-height:1.5;}
  .card-footer .valid b{color:var(--gold-soft);font-size:9.5px;display:block;font-weight:700;}
  .card-footer .qr-wrap{text-align:center;}
  .card-footer .qr-box{background:#fff;padding:3px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.25);}
  .card-footer .qr-box canvas,.card-footer .qr-box img{display:block;width:40px;height:40px;}
  .card-footer .qr-cap{font-size:6px;letter-spacing:.08em;color:rgba(255,255,255,.5);margin-top:3px;text-transform:uppercase;}

  .btn{background:var(--navy);color:var(--gold-soft);border:none;padding:11px 22px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(15,39,64,.3);}
  .btn:active{transform:scale(.97);}
  .file-btn{font-size:12px;}
  .hint{font-size:11px;color:#8892A0;margin-top:2px;}

  @media print{
    @page{ size:85.6mm 54mm; margin:0; }
    body{background:#fff;padding:0;}
    body *{visibility:hidden;}
    .id-card,.id-card *{visibility:visible;}
    .id-card{position:absolute;top:0;left:0;width:85.6mm;height:54mm;border-radius:0;box-shadow:none;}
    .id-card .notch{background:#fff;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="form-col">
    <div class="kicker">Identity Documents</div>
    <h2>Teacher ID Card Generator</h2>

    <div class="group" id="brandingBlock">
      <div class="group-title">Branding</div>
      <label>School Logo</label>
      <input type="file" id="schoolLogo" class="file-btn" accept="image/*">
      <label>School Name</label>
      <input type="text" id="schoolName" placeholder="e.g. Islamia School & College" value="Islamia School & College">
      <p class="hint">Card colour is drawn automatically from the logo.</p>
    </div>

    <label>Teacher Photo</label>
    <input type="file" id="teacherPhoto" class="file-btn" accept="image/*">

    <label>Name</label>
    <input type="text" id="name" placeholder="Full name">

    <label>Qualification</label>
    <input type="text" id="qualification" placeholder="e.g. M.Ed, B.Sc">

    <label>Designation</label>
    <input type="text" id="designation" placeholder="e.g. Senior Teacher">

    <label>Joining Date</label>
    <input type="date" id="joining">

    <label>Contact</label>
    <input type="text" id="contact" placeholder="e.g. 03001234567">
  </div>

  <div class="card-col">
    <div class="id-card" id="idCard">
      <span class="notch"></span>
      <div class="card-top">
        <div class="logo-ring"><img id="cardLogo" src="https://placehold.co/40x40/ffffff/0F2740?text=S"></div>
        <div class="brand-text">
          <div class="sname" id="cardSchool">Islamia School &amp; College</div>
          <div class="tagline">Staff Identity Card</div>
        </div>
        <div class="role-tag">Staff</div>
      </div>
      <div class="card-rule"></div>
      <div class="card-body">
        <img class="photo" id="cardPhoto" src="https://placehold.co/70x80/33475A/ffffff?text=Photo">
        <div class="card-main">
          <div class="cname" id="cardName">Teacher Name</div>
          <div class="info-grid">
            <div class="full"><span class="lbl">Qualification</span><b id="cardQual">—</b></div>
            <div><span class="lbl">Designation</span><b id="cardDesig">—</b></div>
            <div><span class="lbl">Joined</span><b id="cardJoining">—</b></div>
            <div class="full"><span class="lbl">Contact</span><b id="cardContact">—</b></div>
          </div>
        </div>
      </div>
      <div class="card-footer">
        <div class="valid">Session<b id="cardSession">—</b></div>
        <div class="qr-wrap">
          <div class="qr-box" id="qrBox"></div>
          <div class="qr-cap">Scan to verify</div>
        </div>
      </div>
    </div>

    <button class="btn" onclick="window.print()">Print / Save as PDF</button>
  </div>
</div>

<script>
  // ---- PER-CLIENT SCHOOL CONFIG ----
  // Same convention as the student ID card generator — set once per deployed
  // school (inject from Supabase school_settings, or hardcode per client copy).
  // window.SCHOOL_CONFIG = { name: 'Islamia School & College', logo: 'https://.../logo.png' };

  const $ = id => document.getElementById(id);
  let qr = new QRCode($('qrBox'), { text: 'teacher', width: 44, height: 44 });

  (function applySchoolConfig(){
    const cfg = window.SCHOOL_CONFIG;
    if (!cfg) return;
    if (cfg.name) { $('schoolName').value = cfg.name; $('cardSchool').textContent = cfg.name; }
    if (cfg.logo) {
      $('cardLogo').crossOrigin = 'anonymous';
      $('cardLogo').onload = () => applyLogoBackground($('cardLogo'));
      $('cardLogo').src = cfg.logo;
    }
    $('schoolName').readOnly = true;
    $('schoolLogo').disabled = true;
    document.getElementById('brandingBlock').style.opacity = '.6';
  })();

  function readImage(inputEl, targetImgEl){
    inputEl.addEventListener('change', e => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev => { targetImgEl.src = ev.target.result; };
      reader.readAsDataURL(file);
    });
  }
  readImage($('teacherPhoto'), $('cardPhoto'));

  // Card background: instead of a manual upload, the color is derived
  // automatically from the school logo's dominant color, so the card always
  // matches the school's branding.
  const idCardEl = $('idCard');
  function getDominantColor(imgEl){
    try{
      const size = 40;
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      ctx.drawImage(imgEl, 0, 0, size, size);
      const data = ctx.getImageData(0, 0, size, size).data;
      let r=0,g=0,b=0,n=0;
      for(let i=0;i<data.length;i+=4){
        if(data[i+3] < 100) continue; // skip transparent pixels
        const rr=data[i], gg=data[i+1], bb=data[i+2];
        // Skip near-white/near-black pixels so a white logo background or
        // black outline doesn't wash out the actual brand color.
        if((rr>235&&gg>235&&bb>235) || (rr<20&&gg<20&&bb<20)) continue;
        r+=rr; g+=gg; b+=bb; n++;
      }
      if(!n) return null;
      return { r: Math.round(r/n), g: Math.round(g/n), b: Math.round(b/n) };
    }catch(e){ return null; } // canvas tainted by a cross-origin logo — keep default
  }
  function shade(rgb, amt){
    return {
      r: Math.max(0, Math.min(255, rgb.r + amt)),
      g: Math.max(0, Math.min(255, rgb.g + amt)),
      b: Math.max(0, Math.min(255, rgb.b + amt))
    };
  }
  function applyLogoBackground(imgEl){
    const rgb = getDominantColor(imgEl);
    if(!rgb) return;
    const dark = shade(rgb, -40);
    idCardEl.style.backgroundImage =
      `linear-gradient(135deg, rgb(${rgb.r},${rgb.g},${rgb.b}), rgb(${dark.r},${dark.g},${dark.b}))`;
  }
  $('schoolLogo').addEventListener('change', e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      $('cardLogo').src = ev.target.result;
      $('cardLogo').onload = () => applyLogoBackground($('cardLogo'));
    };
    reader.readAsDataURL(file);
  });

  function fmtDate(v){
    if(!v) return '—';
    const d = new Date(v);
    if (isNaN(d)) return v;
    return String(d.getDate()).padStart(2,'0') + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + d.getFullYear();
  }

  function updateQR(){
    const data = [
      $('name').value, $('qualification').value, $('designation').value,
      fmtDate($('joining').value), $('contact').value, $('schoolName').value
    ].join(' | ');
    qr.clear();
    qr.makeCode(data || 'teacher');
  }

  // Academic session label (e.g. "2026–27"), computed automatically so
  // no extra input is needed; assumes an April–March school year.
  function sessionLabel(){
    const d = new Date();
    const startY = (d.getMonth() + 1) >= 4 ? d.getFullYear() : d.getFullYear() - 1;
    return startY + '–' + String(startY + 1).slice(-2);
  }
  $('cardSession').textContent = sessionLabel();

  ['name','qualification','designation','joining','contact','schoolName'].forEach(id=>{
    $(id).addEventListener('input', () => {
      $('cardName').textContent = $('name').value || 'Teacher Name';
      $('cardQual').textContent = $('qualification').value || '—';
      $('cardDesig').textContent = $('designation').value || '—';
      $('cardJoining').textContent = fmtDate($('joining').value);
      $('cardContact').textContent = $('contact').value || '—';
      $('cardSchool').textContent = $('schoolName').value || '—';
      updateQR();
    });
  });
</script>
</body>
</html>
