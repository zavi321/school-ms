<meta charset="UTF-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@600;700&family=Noto+Sans+Urdu:wght@400;500;600&display=swap">

<style>
  :root{
    --navy:#0F2740; --navy-deep:#0A1B2C; --gold:#C9A227; --gold-soft:#E4C765;
    --cream:#FAF6EC; --card:#FFFFFF; --ink:#1C2530; --sage:#3F7154; --rust:#B24A32; --line:#E7E0CE;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,sans-serif;}
  body.ur{font-family:'Noto Sans Urdu',sans-serif;direction:rtl;}
  .hidden{display:none !important;}
  button{cursor:pointer;font-family:inherit;}
  input,select{font-family:inherit;font-size:14px;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);outline:none;}
  label{display:block;margin-bottom:12px;}
  label span{display:block;font-size:12px;font-weight:500;opacity:.7;margin-bottom:4px;}

  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--navy);}
  .auth-box{width:100%;max-width:380px;}
  .auth-brand{text-align:center;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-soft);opacity:.8;margin-bottom:20px;}
  .auth-card{background:var(--cream);border-radius:18px;padding:22px;}
  .auth-card h2{margin:0 0 4px;color:var(--navy);font-family:Fraunces,serif;font-size:19px;}
  body.ur .auth-card h2{font-family:'Noto Nastaliq Urdu',serif;}
  .auth-card p.desc{font-size:12px;opacity:.65;margin:0 0 16px;}
  .err{color:var(--rust);font-size:12px;margin-bottom:10px;}
  .ok{color:var(--sage);font-size:12px;margin-bottom:10px;}
  .switch-line{text-align:center;font-size:13px;margin-top:14px;}
  .switch-line a{color:var(--navy);font-weight:600;text-decoration:underline;cursor:pointer;}

  .btn-primary{background:var(--navy);color:var(--gold-soft);border:none;border-radius:10px;padding:11px;font-weight:600;font-size:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;}
  .btn-primary:disabled{opacity:.6;}
  .btn-ghost{background:#F0EBDA;color:var(--navy);border:none;border-radius:10px;padding:11px;font-weight:500;font-size:14px;flex:1;}
  .btn-ghost.danger{background:#FBEAE5;color:var(--rust);}
  .lang-mini{background:#F0EAD6;color:var(--navy);border:none;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;}

  #app{padding-bottom:90px;}
  header.top{background:var(--navy);padding:24px 16px 30px;border-radius:0 0 22px 22px;position:relative;overflow:hidden;}
  header.top .glow{position:absolute;width:150px;height:150px;border-radius:999px;background:var(--gold);opacity:.1;right:-30px;top:-30px;}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;position:relative;}
  .top-row .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);opacity:.85;}
  .top-row .title{color:#fff;font-family:Fraunces,serif;font-size:20px;font-weight:600;margin-top:2px;}
  body.ur .top-row .title{font-family:'Noto Nastaliq Urdu',serif;}
  .top-actions{display:flex;gap:8px;}
  .pill-btn{border:none;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;}
  .pill-btn.lang{background:var(--gold-soft);color:var(--navy-deep);}
  .pill-btn.lock{background:rgba(255,255,255,.12);color:var(--gold-soft);}

  main{padding:0 16px;margin-top:-16px;}
  .notice{margin-top:24px;font-size:11px;text-align:center;padding:8px 12px;border-radius:8px;color:var(--navy);opacity:.55;background:#F0EAD6;}

  nav.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px;z-index:40;}
  nav.bottom .bar{max-width:420px;margin:0 auto;background:var(--navy);border-radius:16px;display:flex;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  nav.bottom button{flex:1;background:transparent;border:none;border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#8FA3B8;font-size:10px;font-weight:500;}
  nav.bottom button.active{background:rgba(201,162,39,.18);color:var(--gold-soft);}
  nav.bottom button svg{width:18px;height:18px;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .stat-card .lbl{font-size:11px;opacity:.65;margin:6px 0 2px;}
  .stat-card .val{font-size:22px;font-weight:600;color:var(--navy);font-family:Fraunces,serif;}
  .balance-card{background:var(--navy);border-radius:14px;padding:16px;margin-top:12px;}
  .balance-card .lbl{color:var(--gold-soft);opacity:.85;font-size:12px;}
  .balance-card .val{color:#fff;font-size:30px;font-weight:600;font-family:Fraunces,serif;margin-top:4px;}

  .section-title{font-size:14px;font-weight:600;color:var(--navy);margin:20px 0 8px;}
  .list-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .list-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .list-row .nm{font-size:14px;font-weight:500;}
  .list-row .sub{font-size:11px;opacity:.5;margin-top:1px;}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:32px;text-align:center;font-size:13px;opacity:.6;}

  .searchbar{display:flex;gap:8px;margin-bottom:12px;}
  .searchbar input{flex:1;}
  .icon-btn{background:var(--navy);border:none;border-radius:10px;width:42px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}

  .card-btn{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  body.ur .card-btn{text-align:right;}
  .card-btn .nm{font-size:14px;font-weight:600;color:var(--navy);}
  .card-btn .sub{font-size:11px;opacity:.55;margin-top:2px;}
  .pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;}
  .pill.good{color:var(--sage);background:#EAF2EC;}
  .pill.bad{color:var(--rust);background:#FBEAE5;}

  .modal-bg{position:fixed;inset:0;background:rgba(15,39,64,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .modal{width:100%;max-width:420px;max-height:90vh;overflow-y:auto;background:var(--cream);border-radius:18px 18px 0 0;padding:20px;}
  @media(min-width:640px){.modal-bg{align-items:center;}.modal{border-radius:18px;}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .modal-head h3{margin:0;font-size:17px;color:var(--navy);font-family:Fraunces,serif;}
  body.ur .modal-head h3{font-family:'Noto Nastaliq Urdu',serif;}
  .modal-head button{background:none;border:none;font-size:20px;color:var(--ink);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .flexgap{display:flex;gap:8px;margin-top:14px;}
  .type-toggle{display:flex;gap:8px;margin-bottom:14px;}
  .type-toggle button{flex:1;border:none;border-radius:10px;padding:9px;font-size:13px;font-weight:600;background:#F0EBDA;color:var(--navy);}
  .type-toggle button.on-income{background:var(--sage);color:#fff;}
  .type-toggle button.on-expense{background:var(--rust);color:#fff;}
  .greenbox{background:#EAF2EC;border-radius:10px;padding:10px 12px;margin-bottom:16px;}
  .greenbox .lbl{font-size:11px;color:var(--sage);}
  .greenbox .val{font-size:17px;font-weight:600;color:var(--sage);}
  .ledger{border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .ledger-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);}
  .ledger-row:last-child{border-bottom:none;}
  .amt-pos{color:var(--sage);font-weight:600;font-size:14px;}
  .amt-neg{color:var(--rust);font-weight:600;font-size:14px;}
  .del-btn{background:none;border:none;color:var(--rust);font-size:14px;}
  .loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:14px;}

  .card-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch;}
  table.card-table{border-collapse:collapse;width:100%;min-width:820px;font-size:11px;background:#fff;}
  table.card-table th{background:var(--navy);color:var(--gold-soft);font-weight:600;padding:7px 8px;text-align:center;white-space:nowrap;position:sticky;top:0;}
  table.card-table td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.card-table tr:last-child td{border-bottom:none;}
  table.card-table td.mo{font-weight:600;color:var(--navy);text-align:left;}
  body.ur table.card-table td.mo{text-align:right;}
  table.card-table td.bal-neg{color:var(--rust);font-weight:700;}
  table.card-table td.bal-pos{color:var(--sage);font-weight:700;}
  .del-x{background:none;border:none;color:var(--rust);font-size:12px;padding:0;}
</style>
</head>

// ---------------- Boot / session ----------------
async function boot() {
  document.body.className = LANG === 'ur' ? 'ur' : '';
  const { data:{ session } } = await sb.auth.getSession();
  document.getElementById('loading').classList.add('hidden');
  if (session && session.user) {
    CURRENT_USER = session.user;
    await afterLogin();
  } else {
    renderLogIn();
  }
}

async function afterLogin() {
  const { data: prof } = await sb.from('profiles').select('*').eq('id', CURRENT_USER.id).maybeSingle();
  CURRENT_PROFILE = prof || { school_name: 'My School' };
  await loadAllData();
  renderApp();
}

// ---------------- Auth screens ----------------
function renderAuthShell(inner) {
  document.getElementById('app').classList.add('hidden');
  document.getElementById('auth-root').innerHTML = `
    <div class="auth-wrap">
      <div class="auth-box">
        <div class="auth-brand">${esc(t.appName)}</div>
        <div class="auth-card">${inner}</div>
      </div>
    </div>`;
}

function renderLogIn() {
  renderAuthShell(`
    <div style="text-align:${LANG==='ur'?'right':'left'};margin-bottom:8px;">
      <button class="lang-mini" onclick="toggleLangAuth(false)">${esc(t.langToggle)}</button>
    </div>
    <h2>${esc(t.logInTitle)}</h2>
    <p class="desc">${esc(t.logInDesc)}</p>
    <label><span>${esc(t.email)}</span><input id="li-email" type="email" autocomplete="email"></label>
    <label><span>${esc(t.password)}</span><input id="li-pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitLogIn()"></label>
    <div id="auth-msg"></div>
    <button class="btn-primary" id="li-btn" onclick="submitLogIn()">${esc(t.logIn)}</button>
    <div class="switch-line">${esc(t.noAccount)} <a onclick="renderSignUp()">${esc(t.signUp)}</a></div>
  `);
}

function renderSignUp() {
  renderAuthShell(`
    <div style="text-align:${LANG==='ur'?'right':'left'};margin-bottom:8px;">
      <button class="lang-mini" onclick="toggleLangAuth(true)">${esc(t.langToggle)}</button>
    </div>
    <h2>${esc(t.signUpTitle)}</h2>
    <p class="desc">${esc(t.signUpDesc)}</p>
    <label><span>${esc(t.schoolName)}</span><input id="su-school"></label>
    <label><span>${esc(t.email)}</span><input id="su-email" type="email" autocomplete="email"></label>
    <label><span>${esc(t.password)}</span><input id="su-pw" type="password" autocomplete="new-password"></label>
    <label><span>${esc(t.confirmPassword)}</span><input id="su-pw2" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')submitSignUp()"></label>
    <div id="auth-msg"></div>
    <button class="btn-primary" id="su-btn" onclick="submitSignUp()">${esc(t.signUp)}</button>
    <div class="switch-line">${esc(t.haveAccount)} <a onclick="renderLogIn()">${esc(t.logIn)}</a></div>
  `);
}

function toggleLangAuth(isSignUp) {
  LANG = LANG === 'en' ? 'ur' : 'en';
  localStorage.setItem('sms_lang', LANG);
  t = T[LANG];
  document.body.className = LANG === 'ur' ? 'ur' : '';
  isSignUp ? renderSignUp() : renderLogIn();
}

async function submitSignUp() {
  const school = document.getElementById('su-school').value.trim();
  const email = document.getElementById('su-email').value.trim();

  const pw2 = document.getElementById('su-pw2').value;

// ---------------- Data loading (RLS auto-scopes everything to this school) ----------------
async function loadAllData() {
  const [s, fp, tc, sp, tx] = await Promise.all([
    sb.from('students').select('*').order('created_at'),
    sb.from('fee_payments').select('*'),
    sb.from('teachers').select('*').order('created_at'),
    sb.from('salary_payments').select('*'),
    sb.from('transactions').select('*').order('txn_date',{ascending:false}),
  ]);
  DATA.students = s.data || [];
  DATA.feePayments = fp.data || [];
  DATA.teachers = tc.data || [];
  DATA.salaryPayments = sp.data || [];
  DATA.transactions = tx.data || [];
}

function studentPayments(id){ return DATA.feePayments.filter(p=>p.student_id===id); }
function teacherPayments(id){ return DATA.salaryPayments.filter(p=>p.teacher_id===id); }

// ---------------- Stats ----------------
function computeStats() {
  const cur = monthKey();
  const active = DATA.students.filter(s=>s.status!=='inactive');
  let feesCollectedThisMonth=0, feesDueThisMonth=0;
  active.forEach(s=>{
    const paid = studentPayments(s.id).filter(p=>p.month===cur).reduce((a,b)=>a+Number(b.amount),0);
    feesCollectedThisMonth += paid;
    feesDueThisMonth += Math.max(0, Number(s.monthly_fee||0)-paid);
  });
  let salaryPaidThisMonth=0;
  DATA.teachers.forEach(tc=>{ salaryPaidThisMonth += teacherPayments(tc.id).filter(p=>p.month===cur).reduce((a,b)=>a+Number(b.amount),0); });

  let totalCollectedAllTime=0;
  active.forEach(s=>{ totalCollectedAllTime += studentPayments(s.id).reduce((a,b)=>a+Number(b.amount),0); });
  let totalSalariesAllTime=0;
  DATA.teachers.forEach(tc=>{ totalSalariesAllTime += teacherPayments(tc.id).reduce((a,b)=>a+Number(b.amount),0); });
  const totalOtherIncomeAllTime = DATA.transactions.filter(x=>x.type==='income').reduce((a,b)=>a+Number(b.amount),0);
  const totalOtherExpenseAllTime = DATA.transactions.filter(x=>x.type==='expense').reduce((a,b)=>a+Number(b.amount),0);
  const netBalance = (totalCollectedAllTime+totalOtherIncomeAllTime) - (totalSalariesAllTime+totalOtherExpenseAllTime);

  return { activeCount:active.length, feesCollectedThisMonth, feesDueThisMonth, salaryPaidThisMonth,
    totalCollectedAllTime, totalSalariesAllTime, totalOtherIncomeAllTime, totalOtherExpenseAllTime, netBalance };
}

  const rows = entries.map(e => {
    const lastBalance = running;
    const totalDues = lastBalance + Number(e.school_fee||0) + Number(e.sports_fund||0) + Number(e.admission_fee||0) + Number(e.exam_fee||0);

  const totalPaid = payments.reduce((a,b)=>a+Number(b.amount),0);
  showModal(tc.name, `
    <div style="font-size:12px;opacity:.7;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:12px;">
      <span>${esc(t.subject)}: ${esc(tc.subject||'')}</span>
      <span>${esc(t.monthlySalary)}: ₨${fmt(tc.monthly_salary)}</span>
    </div>
    <div class="greenbox"><div class="lbl">${esc(t.totalSalariesAllTime)}</div><div class="val">₨${fmt(totalPaid)}</div></div>
    <div class="section-title" style="margin-top:0;">${esc(t.payMonth)}</div>
    <div class="row2">
      <input id="p-month" type="month" value="${monthKey()}">
      <input id="p-amount" type="number" placeholder="${esc(t.enterAmount)}" value="${tc.monthly_salary||''}">
    </div>
    <div style="margin-top:8px;"><input id="p-date" type="date" value="${todayISO()}"></div>
    <div style="margin-top:8px;"><button class="btn-primary" onclick="submitSalaryPayment('${id}')">+ ${esc(t.save)}</button></div>
    <div class="section-title">${esc(t.salaryLedger)}</div>
    <div class="ledger">
      ${payments.length===0 ? `<div style="padding:10px;text-align:center;font-size:12px;opacity:.5;">—</div>` :
        payments.map(p=>`
          <div class="ledger-row">
            <div style="font-size:12px;">${esc(monthLabel(p.month))} <span style="opacity:.5;">· ${esc(p.pay_date)}</span></div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="amt-neg">₨${fmt(p.amount)}</span>
              <button class="del-btn" onclick="deleteSalaryPayment('${p.id}','${id}')">✕</button>
            </div>
          </div>`).join('')}
    </div>
    <div style="margin-top:16px;"><button class="btn-ghost danger" onclick="confirmDelete('teacher','${id}')">${esc(t.delete)}</button></div>
  `);
}

async function submitSalaryPayment(teacherId) {
  const month = document.getElementById('p-month').value;
  const amount = document.getElementById('p-amount').value;
  const date = document.getElementById('p-date').value;
  if (!amount) return;
  await sb.from('salary_payments').insert({ owner_id: CURRENT_USER.id, teacher_id: teacherId, month, amount: Number(amount), pay_date: date });
  await loadAllData(); openTeacherDetail(teacherId);
}
async function deleteSalaryPayment(paymentId, teacherId) {
  await sb.from('salary_payments').delete().eq('id', paymentId);
  await loadAllData(); openTeacherDetail(teacherId);
}

// ---------------- Finance ----------------
function tplFinance() {
  return `
    <div style="padding-top:16px;">
      <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
        <button class="btn-primary" style="width:auto;padding:9px 16px;" onclick="openAddTxn()">+ ${esc(t.addTransaction)}</button>
      </div>
      ${DATA.transactions.length===0 ? `<div class="empty">${esc(t.noTransactions)}</div>` :
        `<div class="list-card">` + DATA.transactions.map(x=>`
          <div class="list-row">
            <div><div class="nm">${esc(x.description||'')}</div><div class="sub">${esc(x.category||'')} · ${esc(x.txn_date||'')}</div></div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="${x.type==='income'?'amt-pos':'amt-neg'}">${x.type==='income'?'+':'−'}₨${fmt(x.amount)}</span>
              <button class="del-btn" onclick="deleteTxn('${x.id}')">✕</button>
            </div>
          </div>`).join('') + `</div>`}
    </div>`;
}

let txnType = 'expense';
function openAddTxn() {
  txnType = 'expense';
  showModal(t.addTransaction, `
    <div class="type-toggle">
      <button id="btn-income" onclick="setTxnType('income')">${esc(t.income)}</button>
      <button id="btn-expense" class="on-expense" onclick="setTxnType('expense')">${esc(t.expense)}</button>
    </div>
    <label><span>${esc(t.category)}</span><select id="f-cat"></select></label>
    <label><span>${esc(t.description)}</span><input id="f-desc"></label>
    <label><span>${esc(t.amount)}</span><input id="f-amt" type="number"></label>
    <label><span>${esc(t.date)}</span><input id="f-date" type="date" value="${todayISO()}"></label>
    <div class="flexgap">
      <button class="btn-ghost" onclick="closeModal()">${esc(t.cancel)}</button>
      <button class="btn-primary" style="flex:1" onclick="submitAddTxn()">${esc(t.save)}</button>
    </div>
  `);
  fillCatOptions();
}
function setTxnType(type) {
  txnType = type;
  document.getElementById('btn-income').className = type==='income' ? 'on-income' : '';
  document.getElementById('btn-expense').className = type==='expense' ? 'on-expense' : '';
  fillCatOptions();
}
function fillCatOptions() {
  const cats = txnType==='income' ? INCOME_CATS : EXPENSE_CATS;
  document.getElementById('f-cat').innerHTML = cats.map(c=>`<option>${c}</option>`).join('');
}
async function submitAddTxn() {
  const desc = document.getElementById('f-desc').value.trim();
  const amt = document.getElementById('f-amt').value;
  if (!desc || amt==='') return;
  await sb.from('transactions').insert({
    owner_id: CURRENT_USER.id,
    type: txnType, category: document.getElementById('f-cat').value, description: desc,
    amount: Number(amt), txn_date: document.getElementById('f-date').value
  });
  closeModal(); await loadAllData(); renderTab();
}
async function deleteTxn(id) {
  await sb.from('transactions').delete().eq('id', id);
  await loadAllData(); renderTab();
}

// ---------------- Reports ----------------
function tplReports() {
  const s = computeStats();
  const perClass = {};
  DATA.students.filter(x=>x.status!=='inactive').forEach(st=>{
    const cls = st.class_name || '—';
    if (!perClass[cls]) perClass[cls] = {count:0, collected:0};
    perClass[cls].count++;
    perClass[cls].collected += studentPayments(st.id).reduce((a,b)=>a+Number(b.amount),0);
  });
  const rows = [
    [t.totalCollectedAllTime, s.totalCollectedAllTime, 'amt-pos'],
    [t.totalSalariesAllTime, s.totalSalariesAllTime, 'amt-neg'],
    [t.totalOtherIncomeAllTime, s.totalOtherIncomeAllTime, 'amt-pos'],
    [t.totalOtherExpenseAllTime, s.totalOtherExpenseAllTime, 'amt-neg'],
  ];
  return `
    <div style="padding-top:16px;">
      <div class="section-title" style="margin-top:0;">${esc(t.summaryReport)}</div>
      <div class="list-card">
        ${rows.map(([l,v,cls])=>`<div class="list-row"><span style="font-size:13px;">${esc(l)}</span><span class="${cls}">₨${fmt(v)}</span></div>`).join('')}
      </div>
      <div class="section-title">${esc(t.perClassBreakdown)}</div>
      <div class="list-card">
        ${Object.keys(perClass).length===0 ? `<div style="padding:16px;text-align:center;opacity:.5;font-size:13px;">—</div>` :
          Object.entries(perClass).map(([cls,d])=>`
            <div class="list-row">
              <span style="font-size:13px;font-weight:500;">${esc(cls)} <span style="font-size:11px;opacity:.5;">(${d.count})</span></span>
              <span class="amt-pos">₨${fmt(d.collected)}</span>
            </div>`).join('')}
      </div>
    </div>`;
}

// ---------------- Modal helpers ----------------
function showModal(title, bodyHtml) {
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-head"><h3>${esc(title)}</h3><button onclick="closeModal()">✕</button></div>
        ${bodyHtml}
      </div>
    </div>`;
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

function confirmDelete(kind, id) {
  showModal(t.delete, `
    <p style="font-size:14px;">${esc(t.confirmDelete)}</p>
    <div class="flexgap">
      <button class="btn-ghost" onclick="closeModal()">${esc(t.no)}</button>
      <button class="btn-primary" style="flex:1;background:var(--rust);" onclick="doDelete('${kind}','${id}')">${esc(t.yes)}</button>
    </div>
  `);
}
async function doDelete(kind, id) {
  if (kind==='student') await sb.from('students').delete().eq('id', id);
  if (kind==='teacher') await sb.from('teachers').delete().eq('id', id);
  closeModal(); await loadAllData(); renderTab();
}

boot();
</script>
</body>
