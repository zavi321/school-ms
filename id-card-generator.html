<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student ID Card Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{ --navy:#0F2740; --gold:#C9A227; --line:#E2E2E2; }
  *{box-sizing:border-box;}
  body{font-family:Arial,sans-serif;background:#F4F4F4;margin:0;padding:20px;}
  .wrap{max-width:900px;margin:0 auto;display:flex;gap:24px;flex-wrap:wrap;}
  .form-col{flex:1;min-width:280px;background:#fff;border-radius:10px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .form-col h2{margin-top:0;font-size:18px;color:var(--navy);}
  label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:#333;}
  input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;}
  .card-col{flex:0 0 340px;display:flex;flex-direction:column;align-items:center;gap:16px;}

  /* ---- ID CARD ---- */
  .id-card{
    width:320px;height:200px;border-radius:14px;background:linear-gradient(135deg,var(--navy),#173A5E);
    background-size:cover;background-position:center;
    color:#fff;padding:14px;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.25);
    font-family:Arial,sans-serif;
  }
  .id-card .school-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .id-card .school-row img.logo{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#fff;}
  .id-card .school-row .sname{font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--gold);}
  .id-card .body{display:flex;gap:12px;}
  .id-card .photo{width:70px;height:80px;border-radius:6px;background:#33475A;object-fit:cover;flex-shrink:0;border:2px solid var(--gold);}
  .id-card .info{font-size:11.5px;line-height:1.55;}
  .id-card .info b{color:#fff;}
  .id-card .info .lbl{opacity:.65;display:inline-block;width:62px;}
  .id-card .qr{position:absolute;right:12px;bottom:12px;background:#fff;padding:3px;border-radius:4px;}
  .id-card .qr img,.id-card .qr canvas{display:block;width:44px;height:44px;}

  .btn{background:var(--navy);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn:active{transform:scale(.97);}
  .file-btn{font-size:12px;}

  @media print{
    body *{visibility:hidden;}
    .id-card,.id-card *{visibility:visible;}
    .id-card{position:absolute;top:0;left:0;box-shadow:none;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="form-col">
    <h2>Student ID Card Generator</h2>

    <label>Student Photo</label>
    <input type="file" id="studentPhoto" class="file-btn" accept="image/*">

    <div id="brandingBlock">
      <label>School Logo</label>
      <input type="file" id="schoolLogo" class="file-btn" accept="image/*">

      <label>School Name</label>
      <input type="text" id="schoolName" placeholder="e.g. Islamia School & College" value="Islamia School & College">
    </div>

    <label>Student Name</label>
    <input type="text" id="name" placeholder="Full name">

    <label>Father Name</label>
    <input type="text" id="father" placeholder="Father's name">

    <label>Class</label>
    <input type="text" id="cls" placeholder="e.g. 9th - A">

    <label>Roll No</label>
    <input type="text" id="roll" placeholder="e.g. 101">

    <label>Contact</label>
    <input type="text" id="contact" placeholder="e.g. 03001234567">

    <label>Card Background (optional)</label>
    <input type="file" id="cardBg" class="file-btn" accept="image/*">
    <button type="button" class="btn" id="resetBgBtn" style="margin-top:8px;padding:6px 14px;font-size:12px;">Reset to Default</button>
  </div>

  <div class="card-col">
    <div class="id-card" id="idCard">
      <div class="school-row">
        <img class="logo" id="cardLogo" src="https://placehold.co/40x40/ffffff/0F2740?text=S">
        <div class="sname" id="cardSchool">Islamia School &amp; College</div>
      </div>
      <div class="body">
        <img class="photo" id="cardPhoto" src="https://placehold.co/70x80/33475A/ffffff?text=Photo">
        <div class="info">
          <div><span class="lbl">Name</span><b id="cardName">—</b></div>
          <div><span class="lbl">Father</span><b id="cardFather">—</b></div>
          <div><span class="lbl">Class</span><b id="cardCls">—</b></div>
          <div><span class="lbl">Roll No</span><b id="cardRoll">—</b></div>
          <div><span class="lbl">Contact</span><b id="cardContact">—</b></div>
        </div>
      </div>
      <div class="qr" id="qrBox"></div>
    </div>

    <button class="btn" onclick="window.print()">Print / Save as PDF</button>
  </div>
</div>

<script>
  // ---- PER-CLIENT SCHOOL CONFIG ----
  // Set this once per deployed school (e.g. inject from Supabase school_settings
  // row at page load, or hardcode when building each client's copy). If not set,
  // fields stay manually editable — same file, works for every school either way.
  // window.SCHOOL_CONFIG = { name: 'Islamia School & College', logo: 'https://.../logo.png' };

  const $ = id => document.getElementById(id);
  let qr = new QRCode($('qrBox'), { text: 'student', width: 44, height: 44 });

  (function applySchoolConfig(){
    const cfg = window.SCHOOL_CONFIG;
    if (!cfg) return;
    if (cfg.name) { $('schoolName').value = cfg.name; $('cardSchool').textContent = cfg.name; }
    if (cfg.logo) { $('cardLogo').src = cfg.logo; }
    // Lock branding fields so staff at each school can't accidentally change it
    $('schoolName').readOnly = true;
    $('schoolLogo').disabled = true;
    document.getElementById('brandingBlock').style.opacity = '.6';
  })();

  function readImage(inputEl, targetImgEl){
    inputEl.addEventListener('change', e => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev => { targetImgEl.src = ev.target.result; };
      reader.readAsDataURL(file);
    });
  }
  readImage($('studentPhoto'), $('cardPhoto'));
  readImage($('schoolLogo'), $('cardLogo'));

  // Card background: user-uploaded image, drawn behind the data with a
  // translucent navy tint (same approach as the DMC certificate background)
  // so the white text on top stays readable regardless of the image.
  const DEFAULT_BG = 'linear-gradient(135deg,var(--navy),#173A5E)';
  const idCardEl = $('idCard');
  $('cardBg').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      idCardEl.style.backgroundImage =
        `linear-gradient(rgba(15,39,64,.55),rgba(15,39,64,.55)), url('${ev.target.result}')`;
    };
    reader.readAsDataURL(file);
  });
  $('resetBgBtn').addEventListener('click', () => {
    idCardEl.style.backgroundImage = DEFAULT_BG;
    $('cardBg').value = '';
  });

  function updateQR(){
    const data = [
      $('name').value, $('father').value, $('cls').value,
      $('roll').value, $('contact').value, $('schoolName').value
    ].join(' | ');
    qr.clear();
    qr.makeCode(data || 'student');
  }

  ['name','father','cls','roll','contact','schoolName'].forEach(id=>{
    $(id).addEventListener('input', () => {
      $('cardName').textContent = $('name').value || '—';
      $('cardFather').textContent = $('father').value || '—';
      $('cardCls').textContent = $('cls').value || '—';
      $('cardRoll').textContent = $('roll').value || '—';
      $('cardContact').textContent = $('contact').value || '—';
      $('cardSchool').textContent = $('schoolName').value || '—';
      updateQR();
    });
  });
</script>
</body>
</html>
